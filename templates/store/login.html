{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Kimzie</title>

    <link rel="stylesheet"
          href="{% static 'css/OnlineStorePage1.css' %}">

</head>

<body>

<main class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            KIMZIE
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your Kimzie account
        </p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>

        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </p>

    </div>

</main>

</body>

</html>
