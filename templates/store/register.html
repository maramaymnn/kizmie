{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Kimzie</title>

    <link rel="stylesheet"
          href="{% static 'css/OnlineStorePage1.css' %}">

</head>

<body>
    
<!-- ================= NAVBAR ================= -->

<nav>

    <button class="menu-btn" id="openBtn"></button>

    <h2 class="logo">
        <a href="{% url 'home' %}">Kimzie</a>
    </h2>

    <div class="nav-icons">

        {% if user.is_authenticated %}
            <a href="{% url 'order_history' %}" class="account-link">
                My Orders
            </a>

            <a href="{% url 'logout' %}" class="account-link">
                Logout
            </a>
        {% else %}
            <a href="{% url 'login' %}" class="account-link">
                Login
            </a>

            <a href="{% url 'register' %}" class="account-link">
                Create Account
            </a>
        {% endif %}

        <button class="nav-icon search-icon" id="searchBtn">
            <span></span>
        </button>

        <a href="#" class="nav-icon cart-icon" id="cartBtn">
            <span class="cart-symbol">🛒</span>
            <span id="cartCount"></span>
        </a>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            KIMZIE
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Create your Kimzie account
        </p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="new-password"
                >

            </div>

            <div class="field">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    autocomplete="new-password"
                >

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>

        <p class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</main>

</body>

</html>
